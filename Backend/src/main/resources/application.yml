spring:
  application:
    name: HospitalManagement
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/hospital?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Dhruhit@123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  cache:
    type: simple
    cache-names:
      - doctors
      - departments
      - doctor-availability
      - slots
      - dashboard
  mail:
    host: ${MAIL_HOST:smtp.example.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:user@example.com}
    password: ${MAIL_PASSWORD:password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:google-client-id-placeholder}
            client-secret: ${GOOGLE_CLIENT_SECRET:google-client-secret-placeholder}
            scope: email,profile
          github:
            client-id: ${GITHUB_CLIENT_ID:github-client-id-placeholder}
            client-secret: ${GITHUB_CLIENT_SECRET:github-client-secret-placeholder}
            scope: user:email,read:user

jwt:
  secret: ${JWT_SECRET:YourSuperSecretKeyThatIsAtLeast32BytesLongForSecurity123!}
  access-token-expiry-minutes: ${JWT_EXPIRY_MINUTES:15}

refresh-token:
  expiry-days: ${REFRESH_TOKEN_EXPIRY_DAYS:7}

notification:
  mode: ${NOTIFICATION_MODE:log}
  mail-from: ${MAIL_FROM:noreply@hospital.com}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173,http://10.95.204.112:5173,http://10.95.204.112:3000}

admin:
  username: ${ADMIN_USERNAME:admin@hospital.com}
  password: ${ADMIN_PASSWORD:AdminPassword123!}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}